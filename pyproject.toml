[project]
name = "pfaf-data"
version = "0.1.0"
description = "Scrape Plants For A Future into SQLite and browse it with Datasette"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.5",
    "aiohttp-client-cache[sqlite]>=0.15.0",
    "beautifulsoup4>=4.15.0",
    "datasette>=0.65.5,<1",
    "datasette-gzip>=0.3",
    "datasette-render-images>=0.4",
    "lxml>=6.1.3",
    "rich>=15.0.0",
]

[project.optional-dependencies]
diagram = ["eralchemy[graphviz]>=1.7.0"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.17.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
